[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-at-scale-injection"
version = "0.1.0"
description = "SWE-at-Scale and SWE-at-Scale+ issue injection pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.40.0"]

[project.scripts]
swe-at-scale = "swe_at_scale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
